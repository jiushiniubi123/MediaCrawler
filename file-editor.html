<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>万能文本编辑器 - 支持 Word / Excel / Markdown / JSON / CSV / TXT</title>

<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
:root {
  --bg: #ffffff;
  --bg2: #f5f7fa;
  --bg3: #e8ecf1;
  --text: #1a1a2e;
  --text2: #555;
  --border: #d0d5dd;
  --accent: #4f46e5;
  --accent-hover: #4338ca;
  --accent-light: #eef2ff;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.1);
  --radius: 8px;
  --radius-sm: 6px;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', 'Monaco', monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --toolbar-h: 48px;
  --statusbar-h: 32px;
}

[data-theme="dark"] {
  --bg: #0f172a;
  --bg2: #1e293b;
  --bg3: #334155;
  --text: #e2e8f0;
  --text2: #94a3b8;
  --border: #334155;
  --accent: #818cf8;
  --accent-hover: #6366f1;
  --accent-light: #1e1b4b;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.4);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: background .2s, color .2s;
}

.toolbar {
  height: var(--toolbar-h);
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 6px;
  flex-shrink: 0;
  z-index: 10;
}

.toolbar .sep {
  width: 1px;
  height: 24px;
  background: var(--border);
  margin: 0 4px;
}

.toolbar .spacer { flex: 1; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
  font-family: var(--font-sans);
}
.btn:hover { background: var(--bg3); border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-hover); }
.btn svg { width: 16px; height: 16px; flex-shrink: 0; }

.file-input-label { cursor: pointer; }
.file-input-label input { display: none; }

.main-area {
  flex: 1;
  display: flex;
  overflow: hidden;
}

.sidebar {
  width: 260px;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
}

.sidebar-section {
  padding: 12px;
  border-bottom: 1px solid var(--border);
}

.sidebar-section h3 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--text2);
  margin-bottom: 8px;
  font-weight: 600;
}

.file-info-item {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  padding: 3px 0;
}
.file-info-item .label { color: var(--text2); }
.file-info-item .value { font-weight: 500; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.format-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.format-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 13px;
  transition: background .15s;
  border: 1px solid transparent;
}
.format-item:hover { background: var(--bg3); }
.format-item.active { background: var(--accent-light); border-color: var(--accent); color: var(--accent); font-weight: 500; }

.format-badge {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 3px;
  font-weight: 600;
  text-transform: uppercase;
  background: var(--bg3);
  color: var(--text2);
  min-width: 36px;
  text-align: center;
}

select.encoding-select {
  width: 100%;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--text);
  font-size: 12px;
  font-family: var(--font-sans);
  cursor: pointer;
}

.editor-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.tabs {
  display: flex;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 8px;
  flex-shrink: 0;
}

.tab {
  padding: 8px 16px;
  font-size: 13px;
  cursor: pointer;
  border: none;
  background: none;
  color: var(--text2);
  border-bottom: 2px solid transparent;
  transition: all .15s;
  font-family: var(--font-sans);
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
.tab.hidden { display: none; }

.panels {
  flex: 1;
  position: relative;
  overflow: hidden;
}

.panel {
  position: absolute;
  inset: 0;
  display: none;
  overflow: auto;
}
.panel.active { display: flex; }

.editor-wrapper {
  position: relative;
  width: 100%;
  height: 100%;
}

.line-numbers {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 52px;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  overflow: hidden;
  pointer-events: none;
  padding: 12px 0;
}

.line-numbers-inner {
  color: var(--text2);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  text-align: right;
  padding-right: 10px;
  user-select: none;
}

#textEditor {
  width: 100%;
  height: 100%;
  border: none;
  resize: none;
  padding: 12px 12px 12px 64px;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  background: var(--bg);
  color: var(--text);
  outline: none;
  tab-size: 4;
  white-space: pre-wrap;
  word-wrap: break-word;
}

.preview-panel {
  padding: 20px 24px;
  background: var(--bg);
  line-height: 1.8;
}

.preview-panel h1, .preview-panel h2, .preview-panel h3 { margin-top: 1em; margin-bottom: .5em; }
.preview-panel h1 { font-size: 1.8em; border-bottom: 2px solid var(--border); padding-bottom: 8px; }
.preview-panel h2 { font-size: 1.4em; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.preview-panel p { margin-bottom: .8em; }
.preview-panel code { background: var(--bg2); padding: 2px 6px; border-radius: 3px; font-family: var(--font-mono); font-size: .9em; }
.preview-panel pre { background: var(--bg2); padding: 16px; border-radius: var(--radius-sm); overflow-x: auto; margin-bottom: .8em; }
.preview-panel pre code { background: none; padding: 0; }
.preview-panel blockquote { border-left: 3px solid var(--accent); padding-left: 16px; color: var(--text2); margin: .8em 0; }
.preview-panel table { border-collapse: collapse; width: 100%; margin: .8em 0; }
.preview-panel th, .preview-panel td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
.preview-panel th { background: var(--bg2); font-weight: 600; }
.preview-panel img { max-width: 100%; }
.preview-panel ul, .preview-panel ol { padding-left: 24px; margin-bottom: .8em; }

.table-panel {
  flex-direction: column;
}

.table-toolbar {
  padding: 8px 12px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  flex-shrink: 0;
}

.table-toolbar select {
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--text);
  font-size: 12px;
}

.table-wrapper {
  flex: 1;
  overflow: auto;
}

.data-table {
  border-collapse: collapse;
  width: max-content;
  min-width: 100%;
  font-size: 13px;
}

.data-table th {
  position: sticky;
  top: 0;
  background: var(--bg2);
  border: 1px solid var(--border);
  padding: 8px 12px;
  font-weight: 600;
  text-align: left;
  white-space: nowrap;
  z-index: 1;
}

.data-table td {
  border: 1px solid var(--border);
  padding: 6px 12px;
  white-space: nowrap;
  max-width: 300px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.data-table tr:hover td { background: var(--accent-light); }

.data-table td.editable {
  cursor: cell;
  outline: none;
}
.data-table td.editable:focus {
  background: var(--bg);
  box-shadow: inset 0 0 0 2px var(--accent);
  white-space: pre-wrap;
  max-width: none;
}

.statusbar {
  height: var(--statusbar-h);
  background: var(--bg2);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 16px;
  font-size: 11px;
  color: var(--text2);
  flex-shrink: 0;
}

.statusbar .status-item { display: flex; align-items: center; gap: 4px; }
.statusbar .dot { width: 6px; height: 6px; border-radius: 50%; }
.statusbar .dot.modified { background: var(--warning); }
.statusbar .dot.saved { background: var(--success); }

.welcome-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text2);
  pointer-events: none;
  z-index: 0;
}

.welcome-overlay svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: .3; }
.welcome-overlay p { font-size: 14px; margin-bottom: 4px; }
.welcome-overlay .drop-hint { font-size: 12px; opacity: .6; }

.drag-overlay {
  position: fixed;
  inset: 0;
  background: rgba(79,70,229,.12);
  border: 3px dashed var(--accent);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  font-size: 24px;
  font-weight: 600;
  color: var(--accent);
  pointer-events: none;
}
.drag-overlay.show { display: flex; }

.json-valid { color: var(--success) !important; }
.json-invalid { color: var(--danger) !important; }

@media (max-width: 768px) {
  .sidebar { display: none; }
  .sidebar.open { display: flex; position: absolute; z-index: 20; height: 100%; width: 260px; }
}
</style>
</head>
<body>

<div class="drag-overlay" id="dragOverlay">📂 释放文件以打开</div>

<div class="toolbar">
  <label class="btn file-input-label" title="打开文件 (Ctrl+O)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
    打开
    <input type="file" id="fileInput" accept=".txt,.md,.markdown,.json,.csv,.tsv,.xml,.html,.htm,.yaml,.yml,.ini,.cfg,.conf,.log,.py,.js,.ts,.jsx,.tsx,.css,.scss,.less,.java,.c,.cpp,.h,.hpp,.rs,.go,.rb,.php,.sh,.bat,.ps1,.sql,.r,.m,.swift,.kt,.dart,.vue,.svelte,.xlsx,.xls,.docx,.env,.gitignore,.editorconfig,.toml" multiple>
  </label>

  <button class="btn" id="btnSave" title="保存 (Ctrl+S)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    保存
  </button>

  <button class="btn" id="btnSaveAs" title="另存为 (Ctrl+Shift+S)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/><line x1="12" y1="12" x2="12" y2="17"/><line x1="10" y1="14.5" x2="14" y2="14.5"/></svg>
    另存为
  </button>

  <span class="sep"></span>

  <button class="btn" id="btnUndo" title="撤销 (Ctrl+Z)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
  </button>

  <button class="btn" id="btnRedo" title="重做 (Ctrl+Y)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
  </button>

  <span class="sep"></span>

  <button class="btn" id="btnFormat" title="格式化">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
    格式化
  </button>

  <span class="spacer"></span>

  <button class="btn" id="btnTheme" title="切换主题">
    <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>
</div>

<div class="main-area">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <h3>📄 文件信息</h3>
      <div id="fileInfoContainer">
        <div class="file-info-item"><span class="label">文件名</span><span class="value" id="infoName">—</span></div>
        <div class="file-info-item"><span class="label">格式</span><span class="value" id="infoFormat">—</span></div>
        <div class="file-info-item"><span class="label">大小</span><span class="value" id="infoSize">—</span></div>
        <div class="file-info-item"><span class="label">编码</span><span class="value" id="infoEncoding">—</span></div>
        <div class="file-info-item"><span class="label">行数</span><span class="value" id="infoLines">—</span></div>
      </div>
    </div>

    <div class="sidebar-section">
      <h3>🔤 编码</h3>
      <select class="encoding-select" id="encodingSelect">
        <option value="UTF-8">UTF-8</option>
        <option value="UTF-16LE">UTF-16 LE</option>
        <option value="UTF-16BE">UTF-16 BE</option>
        <option value="GBK">GBK / GB2312</option>
        <option value="Big5">Big5</option>
        <option value="Shift_JIS">Shift_JIS</option>
        <option value="EUC-KR">EUC-KR</option>
        <option value="ISO-8859-1">ISO-8859-1</option>
        <option value="windows-1252">Windows-1252</option>
      </select>
    </div>

    <div class="sidebar-section">
      <h3>📋 格式列表</h3>
      <div class="format-list">
        <div class="format-item" data-format="txt"><span class="format-badge">TXT</span>纯文本</div>
        <div class="format-item" data-format="md"><span class="format-badge">MD</span>Markdown</div>
        <div class="format-item" data-format="json"><span class="format-badge">JSON</span>JSON</div>
        <div class="format-item" data-format="csv"><span class="format-badge">CSV</span>CSV / TSV</div>
        <div class="format-item" data-format="xlsx"><span class="format-badge">XLSX</span>Excel</div>
        <div class="format-item" data-format="docx"><span class="format-badge">DOCX</span>Word</div>
        <div class="format-item" data-format="xml"><span class="format-badge">XML</span>XML / HTML</div>
        <div class="format-item" data-format="code"><span class="format-badge">CODE</span>代码文件</div>
      </div>
    </div>
  </aside>

  <div class="editor-container">
    <div class="tabs" id="tabBar">
      <button class="tab active" data-panel="edit">✏️ 编辑</button>
      <button class="tab" data-panel="preview">👁 预览</button>
      <button class="tab hidden" data-panel="table">📊 表格</button>
    </div>

    <div class="panels">
      <div class="panel active" id="panelEdit">
        <div class="editor-wrapper" id="editorWrapper">
          <div class="line-numbers"><div class="line-numbers-inner" id="lineNumbers">1</div></div>
          <div class="welcome-overlay" id="welcomeOverlay">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            <p>拖放文件到此处，或点击「打开」按钮</p>
            <p class="drop-hint">支持 TXT · Markdown · JSON · CSV · Excel · Word · XML · 代码文件等</p>
          </div>
          <textarea id="textEditor" placeholder="在此编辑内容..."></textarea>
        </div>
      </div>

      <div class="panel preview-panel" id="panelPreview"></div>

      <div class="panel table-panel" id="panelTable">
        <div class="table-toolbar">
          <span>工作表:</span>
          <select id="sheetSelect"></select>
          <span style="margin-left:8px;" id="tableRowCount"></span>
        </div>
        <div class="table-wrapper" id="tableWrapper"></div>
      </div>
    </div>

    <div class="statusbar">
      <span class="status-item"><span class="dot saved" id="statusDot"></span><span id="statusText">就绪</span></span>
      <span class="status-item">编码: <strong id="statusEncoding">UTF-8</strong></span>
      <span class="status-item">行: <strong id="statusLines">0</strong></span>
      <span class="status-item">词: <strong id="statusWords">0</strong></span>
      <span class="status-item">字符: <strong id="statusChars">0</strong></span>
    </div>
  </div>
</div>

<script>
(function() {
  const fileInput = document.getElementById('fileInput');
  const textEditor = document.getElementById('textEditor');
  const lineNumbers = document.getElementById('lineNumbers');
  const welcomeOverlay = document.getElementById('welcomeOverlay');
  const dragOverlay = document.getElementById('dragOverlay');
  const encodingSelect = document.getElementById('encodingSelect');
  const sheetSelect = document.getElementById('sheetSelect');
  const tableWrapper = document.getElementById('tableWrapper');
  const panelEdit = document.getElementById('panelEdit');
  const panelPreview = document.getElementById('panelPreview');
  const panelTable = document.getElementById('panelTable');

  let currentFile = null;
  let currentFormat = 'txt';
  let currentEncoding = 'UTF-8';
  let originalContent = '';
  let isModified = false;
  let undoStack = [];
  let redoStack = [];
  let xlsxWorkbook = null;
  let currentSheetName = '';

  const EXT_FORMAT_MAP = {
    txt: 'txt', md: 'md', markdown: 'md', json: 'json', csv: 'csv', tsv: 'csv',
    xlsx: 'xlsx', xls: 'xlsx', docx: 'docx',
    xml: 'xml', html: 'xml', htm: 'xml', xhtml: 'xml',
    yaml: 'code', yml: 'code', toml: 'code', ini: 'code', cfg: 'code', conf: 'code',
    py: 'code', js: 'code', ts: 'code', jsx: 'code', tsx: 'code',
    css: 'code', scss: 'code', less: 'code',
    java: 'code', c: 'code', cpp: 'code', h: 'code', hpp: 'code',
    rs: 'code', go: 'code', rb: 'code', php: 'code', sh: 'code', bat: 'code',
    sql: 'code', r: 'code', swift: 'code', kt: 'code', dart: 'code',
    vue: 'code', svelte: 'code', env: 'code', gitignore: 'code',
    log: 'txt', editorconfig: 'code',
  };

  function detectFormat(filename) {
    if (!filename) return 'txt';
    const ext = filename.split('.').pop().toLowerCase();
    return EXT_FORMAT_MAP[ext] || 'txt';
  }

  function detectEncoding(buffer) {
    const arr = new Uint8Array(buffer);
    if (arr.length >= 3 && arr[0] === 0xEF && arr[1] === 0xBB && arr[2] === 0xBF) {
      return { encoding: 'UTF-8', bom: 3 };
    }
    if (arr.length >= 2 && arr[0] === 0xFE && arr[1] === 0xFF) {
      return { encoding: 'UTF-16BE', bom: 2 };
    }
    if (arr.length >= 2 && arr[0] === 0xFF && arr[1] === 0xFE) {
      return { encoding: 'UTF-16LE', bom: 2 };
    }
    if (arr.length >= 4 && arr[0] === 0x00 && arr[1] === 0x00 && arr[2] === 0xFE && arr[3] === 0xFF) {
      return { encoding: 'UTF-32BE', bom: 4 };
    }
    return { encoding: 'UTF-8', bom: 0 };
  }

  function decodeText(buffer, encoding, bomOffset) {
    try {
      const slice = buffer.slice(bomOffset || 0);
      if (encoding === 'UTF-8' || encoding === 'GBK' || encoding === 'Big5' || encoding === 'Shift_JIS' || encoding === 'EUC-KR' || encoding === 'ISO-8859-1' || encoding === 'windows-1252') {
        const decoder = new TextDecoder(encoding.toLowerCase());
        return decoder.decode(slice);
      }
      if (encoding === 'UTF-16LE') {
        const decoder = new TextDecoder('utf-16le');
        return decoder.decode(slice);
      }
      if (encoding === 'UTF-16BE') {
        const decoder = new TextDecoder('utf-16be');
        return decoder.decode(slice);
      }
      const decoder = new TextDecoder('utf-8');
      return decoder.decode(slice);
    } catch (e) {
      const decoder = new TextDecoder('utf-8');
      return decoder.decode(buffer);
    }
  }

  function encodeText(text, encoding) {
    if (encoding === 'UTF-8') {
      return new TextEncoder().encode(text);
    }
    try {
      return new TextEncoder().encode(text);
    } catch (e) {
      return new TextEncoder().encode(text);
    }
  }

  function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function pushUndo(content) {
    undoStack.push(content);
    if (undoStack.length > 100) undoStack.shift();
    redoStack = [];
  }

  function setEditorContent(content, pushHistory) {
    if (pushHistory !== false) {
      pushUndo(textEditor.value);
    }
    textEditor.value = content;
    updateLineNumbers();
    updateStatus();
    updatePreview();
    checkWelcome();
    markModified();
  }

  function markModified() {
    if (textEditor.value !== originalContent) {
      isModified = true;
      document.getElementById('statusDot').className = 'dot modified';
      document.getElementById('statusText').textContent = '已修改';
    } else {
      isModified = false;
      document.getElementById('statusDot').className = 'dot saved';
      document.getElementById('statusText').textContent = '已保存';
    }
  }

  function updateLineNumbers() {
    const lines = textEditor.value.split('\n');
    const count = lines.length;
    let html = '';
    for (let i = 1; i <= count; i++) html += i + '\n';
    lineNumbers.textContent = html || '1';
    const lnWidth = Math.max(3, String(count).length);
    document.querySelector('.line-numbers').style.width = (lnWidth * 9 + 16) + 'px';
    textEditor.style.paddingLeft = (lnWidth * 9 + 24) + 'px';
  }

  function updateStatus() {
    const text = textEditor.value;
    const lines = text.split('\n').length;
    const chars = text.length;
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    document.getElementById('statusLines').textContent = lines;
    document.getElementById('statusWords').textContent = words;
    document.getElementById('statusChars').textContent = chars;
    document.getElementById('statusEncoding').textContent = currentEncoding;
    document.getElementById('infoLines').textContent = lines;
  }

  function updatePreview() {
    const format = currentFormat;
    let html = '';
    if (format === 'md') {
      try {
        marked.setOptions({ breaks: true, gfm: true });
        html = marked.parse(textEditor.value);
      } catch (e) {
        html = '<p style="color:var(--danger)">Markdown 解析错误: ' + e.message + '</p>';
      }
    } else if (format === 'json') {
      try {
        const obj = JSON.parse(textEditor.value);
        html = '<pre><code>' + escapeHtml(JSON.stringify(obj, null, 2)) + '</code></pre>';
      } catch (e) {
        html = '<p style="color:var(--danger)">⚠ JSON 格式无效: ' + e.message + '</p>';
      }
    } else if (format === 'xml') {
      html = '<pre><code>' + escapeHtml(textEditor.value) + '</code></pre>';
    } else {
      html = '<pre style="white-space:pre-wrap;font-family:var(--font-mono);font-size:13px;">' + escapeHtml(textEditor.value) + '</pre>';
    }
    panelPreview.innerHTML = html;
  }

  function escapeHtml(str) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    return str.replace(/[&<>"']/g, c => map[c]);
  }

  function buildTable(data, columns) {
    let html = '<table class="data-table"><thead><tr>';
    html += '<th>#</th>';
    for (const col of columns) {
      html += '<th>' + escapeHtml(String(col)) + '</th>';
    }
    html += '</tr></thead><tbody>';
    for (let i = 0; i < data.length; i++) {
      html += '<tr>';
      html += '<td style="color:var(--text2)">' + (i + 1) + '</td>';
      for (const col of columns) {
        const val = data[i][col] !== undefined ? String(data[i][col]) : '';
        html += '<td contenteditable="true" class="editable">' + escapeHtml(val) + '</td>';
      }
      html += '</tr>';
    }
    html += '</tbody></table>';
    tableWrapper.innerHTML = html;
    document.getElementById('tableRowCount').textContent = '共 ' + data.length + ' 行 × ' + columns.length + ' 列';
  }

  function loadCSV(text) {
    const delimiter = text.split('\n')[0].includes('\t') ? '\t' : ',';
    const lines = text.split('\n').filter(l => l.trim());
    if (lines.length === 0) return { columns: [], data: [] };
    const columns = lines[0].split(delimiter).map(c => c.trim().replace(/^"(.*)"$/, '$1'));
    const data = [];
    for (let i = 1; i < lines.length; i++) {
      const vals = parseCSVLine(lines[i], delimiter);
      const row = {};
      columns.forEach((col, idx) => { row[col] = vals[idx] || ''; });
      data.push(row);
    }
    return { columns, data };
  }

  function parseCSVLine(line, delimiter) {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        inQuotes = !inQuotes;
      } else if (ch === delimiter && !inQuotes) {
        result.push(current.replace(/^"|"$/g, ''));
        current = '';
      } else {
        current += ch;
      }
    }
    result.push(current.replace(/^"|"$/g, ''));
    return result;
  }

  function csvToText(data, columns) {
    const lines = [columns.join(',')];
    for (const row of data) {
      const vals = columns.map(c => {
        const v = String(row[c] || '');
        return v.includes(',') || v.includes('"') ? '"' + v.replace(/"/g, '""') + '"' : v;
      });
      lines.push(vals.join(','));
    }
    return lines.join('\n');
  }

  function loadXLSX(buffer) {
    try {
      const workbook = XLSX.read(buffer, { type: 'array' });
      xlsxWorkbook = workbook;
      sheetSelect.innerHTML = workbook.SheetNames.map((n, i) =>
        '<option value="' + i + '"' + (i === 0 ? ' selected' : '') + '>' + escapeHtml(n) + '</option>'
      ).join('');
      currentSheetName = workbook.SheetNames[0];
      const sheet = workbook.Sheets[currentSheetName];
      const data = XLSX.utils.sheet_to_json(sheet, { defval: '' });
      const ref = XLSX.utils.decode_range(sheet['!ref'] || 'A1');
      const columns = [];
      for (let c = ref.s.c; c <= ref.e.c; c++) {
        columns.push(XLSX.utils.encode_col(c));
      }
      buildTable(data, columns);
      showTab('table');
      const textData = XLSX.utils.sheet_to_csv(sheet);
      textEditor.value = textData;
      originalContent = textData;
      updateLineNumbers();
      updateStatus();
      checkWelcome();
      updatePreview();
    } catch (e) {
      alert('Excel 解析失败: ' + e.message);
    }
  }

  function switchXLSXSheet(idx) {
    if (!xlsxWorkbook) return;
    const name = xlsxWorkbook.SheetNames[idx];
    currentSheetName = name;
    const sheet = xlsxWorkbook.Sheets[name];
    const data = XLSX.utils.sheet_to_json(sheet, { defval: '' });
    const ref = XLSX.utils.decode_range(sheet['!ref'] || 'A1');
    const columns = [];
    for (let c = ref.s.c; c <= ref.e.c; c++) {
      columns.push(XLSX.utils.encode_col(c));
    }
    buildTable(data, columns);
    const textData = XLSX.utils.sheet_to_csv(sheet);
    textEditor.value = textData;
    updateLineNumbers();
    updateStatus();
    updatePreview();
  }

  function loadDOCX(buffer) {
    try {
      mammoth.extractRawText({ arrayBuffer: buffer })
        .then(function(result) {
          textEditor.value = result.value;
          originalContent = result.value;
          setCurrentFormat('docx');
          updateLineNumbers();
          updateStatus();
          checkWelcome();
          updatePreview();
          if (result.messages.length > 0) {
            console.warn('DOCX warnings:', result.messages);
          }
        })
        .catch(function(err) {
          alert('Word 文档解析失败: ' + err.message);
        });
    } catch (e) {
      alert('Word 文档解析失败: ' + e.message);
    }
  }

  function loadJSON(text) {
    try {
      const obj = JSON.parse(text);
      textEditor.value = JSON.stringify(obj, null, 2);
      updateLineNumbers();
      updateStatus();
      updatePreview();
    } catch (e) {
      alert('JSON 解析失败: ' + e.message);
    }
  }

  function loadTextFile(buffer, filename) {
    const bom = detectEncoding(buffer);
    let enc = bom.encoding;
    if (enc === 'UTF-8') {
      const bytes = new Uint8Array(buffer);
      let isGBK = true;
      let gbkConfidence = 0;
      for (let i = bom.bom; i < bytes.length; i++) {
        if (bytes[i] < 0x80) continue;
        if (i + 1 >= bytes.length) { gbkConfidence += 0.5; continue; }
        const b1 = bytes[i], b2 = bytes[i + 1];
        if (b1 >= 0x81 && b1 <= 0xFE && b2 >= 0x40 && b2 <= 0xFE) {
          gbkConfidence++;
          i++;
          continue;
        }
        if ((b1 >= 0xC0 && b1 <= 0xDF && b2 >= 0x80 && b2 <= 0xBF) ||
            (b1 >= 0xE0 && b1 <= 0xEF && b2 >= 0x80 && b2 <= 0xBF) ||
            (b1 >= 0xF0 && b1 <= 0xF4 && b2 >= 0x80 && b2 <= 0xBF)) {
          isGBK = false;
          break;
        }
        gbkConfidence += 0.3;
      }
      if (isGBK && gbkConfidence > 2) {
        enc = 'GBK';
      }
    }
    currentEncoding = enc;
    encodingSelect.value = enc;
    const text = decodeText(buffer, enc, bom.bom);
    textEditor.value = text;
    originalContent = text;
    const format = detectFormat(filename);
    setCurrentFormat(format);
    if (format === 'json') {
      try {
        const obj = JSON.parse(text);
        textEditor.value = JSON.stringify(obj, null, 2);
        originalContent = textEditor.value;
      } catch (e) {}
    }
    updateLineNumbers();
    updateStatus();
    checkWelcome();
    updatePreview();
    updateFileInfo(filename, buffer.byteLength);
  }

  function setCurrentFormat(format) {
    currentFormat = format;
    document.querySelectorAll('.format-item').forEach(el => el.classList.remove('active'));
    const item = document.querySelector('.format-item[data-format="' + format + '"]');
    if (item) item.classList.add('active');
    document.getElementById('infoFormat').textContent = format.toUpperCase();
    updateTabVisibility();
  }

  function updateTabVisibility() {
    const previewTab = document.querySelector('.tab[data-panel="preview"]');
    const tableTab = document.querySelector('.tab[data-panel="table"]');
    const editTab = document.querySelector('.tab[data-panel="edit"]');

    if (currentFormat === 'xlsx' || currentFormat === 'csv') {
      tableTab.classList.remove('hidden');
    } else {
      tableTab.classList.add('hidden');
      if (document.querySelector('.tab.active[data-panel="table"]')) {
        showTab('edit');
      }
    }

    if (currentFormat === 'md' || currentFormat === 'json') {
      previewTab.classList.remove('hidden');
    } else {
      previewTab.classList.add('hidden');
    }
  }

  function updateFileInfo(filename, size) {
    document.getElementById('infoName').textContent = filename || '—';
    document.getElementById('infoFormat').textContent = currentFormat.toUpperCase();
    document.getElementById('infoSize').textContent = size ? formatFileSize(size) : '—';
    document.getElementById('infoEncoding').textContent = currentEncoding;
    document.getElementById('infoLines').textContent = textEditor.value.split('\n').length;
  }

  function checkWelcome() {
    if (textEditor.value.trim() === '' && !currentFile) {
      welcomeOverlay.style.display = 'flex';
    } else {
      welcomeOverlay.style.display = 'none';
    }
  }

  function showTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    const tab = document.querySelector('.tab[data-panel="' + name + '"]');
    const panel = document.getElementById('panel' + name.charAt(0).toUpperCase() + name.slice(1));
    if (tab) tab.classList.add('active');
    if (panel) panel.classList.add('active');
    if (name === 'preview') updatePreview();
  }

  function handleFile(file) {
    if (!file) return;
    currentFile = file;
    const reader = new FileReader();
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext === 'xlsx' || ext === 'xls') {
      reader.onload = function(e) {
        loadXLSX(e.target.result);
        updateFileInfo(file.name, file.size);
        currentFormat = 'xlsx';
        document.getElementById('infoFormat').textContent = 'XLSX';
        setCurrentFormat('xlsx');
        isModified = false;
        document.getElementById('statusDot').className = 'dot saved';
        document.getElementById('statusText').textContent = '已保存';
      };
      reader.readAsArrayBuffer(file);
    } else if (ext === 'docx') {
      reader.onload = function(e) {
        loadDOCX(e.target.result);
        updateFileInfo(file.name, file.size);
        currentFormat = 'docx';
        document.getElementById('infoFormat').textContent = 'DOCX';
        setCurrentFormat('docx');
        isModified = false;
        document.getElementById('statusDot').className = 'dot saved';
        document.getElementById('statusText').textContent = '已保存';
      };
      reader.readAsArrayBuffer(file);
    } else {
      reader.onload = function(e) {
        loadTextFile(e.target.result, file.name);
        updateFileInfo(file.name, file.size);
        isModified = false;
        document.getElementById('statusDot').className = 'dot saved';
        document.getElementById('statusText').textContent = '已保存';
      };
      reader.readAsArrayBuffer(file);
    }
    undoStack = [];
    redoStack = [];
  }

  function saveFile(saveAs) {
    let content = textEditor.value;
    let mimeType = 'text/plain';
    let filename = 'untitled.txt';
    let encoding = encodingSelect.value;

    if (currentFile && !saveAs) {
      filename = currentFile.name;
    } else if (saveAs) {
      const extMap = { txt: 'txt', md: 'md', json: 'json', csv: 'csv', xml: 'xml', code: 'txt' };
      filename = (currentFile ? currentFile.name.replace(/\.[^.]+$/, '') : 'untitled') + '.' + (extMap[currentFormat] || 'txt');
    }

    switch (currentFormat) {
      case 'json':
        mimeType = 'application/json';
        break;
      case 'csv':
        mimeType = 'text/csv';
        break;
      case 'md':
        mimeType = 'text/markdown';
        break;
      case 'xml':
        mimeType = 'application/xml';
        break;
      default:
        mimeType = 'text/plain';
    }

    let blob;
    if (encoding === 'UTF-8') {
      blob = new Blob(['\uFEFF' + content], { type: mimeType + ';charset=utf-8' });
    } else {
      blob = new Blob([content], { type: mimeType + ';charset=' + encoding.toLowerCase() });
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    if (!saveAs) {
      originalContent = content;
      isModified = false;
      document.getElementById('statusDot').className = 'dot saved';
      document.getElementById('statusText').textContent = '已保存';
    }
  }

  function formatContent() {
    try {
      if (currentFormat === 'json') {
        const obj = JSON.parse(textEditor.value);
        pushUndo(textEditor.value);
        textEditor.value = JSON.stringify(obj, null, 2);
      } else {
        return;
      }
      updateLineNumbers();
      updateStatus();
      updatePreview();
      markModified();
    } catch (e) {
      alert('格式化失败: ' + e.message);
    }
  }

  function collectTableEdits() {
    const cells = tableWrapper.querySelectorAll('td.editable');
    const rows = tableWrapper.querySelectorAll('tbody tr');
    const columns = [];
    const headers = tableWrapper.querySelectorAll('thead th');
    headers.forEach((th, i) => { if (i > 0) columns.push(th.textContent.trim()); });

    const data = [];
    rows.forEach((row, ri) => {
      const obj = {};
      const tds = row.querySelectorAll('td');
      tds.forEach((td, ci) => {
        if (ci > 0 && columns[ci - 1]) {
          obj[columns[ci - 1]] = td.textContent;
        }
      });
      data.push(obj);
    });

    textEditor.value = csvToText(data, columns);
    updateLineNumbers();
    updateStatus();
    updatePreview();
  }

  textEditor.addEventListener('input', function() {
    updateLineNumbers();
    updateStatus();
    markModified();
    
    clearTimeout(textEditor._previewTimer);
    textEditor._previewTimer = setTimeout(function() {
      if (document.getElementById('panelPreview').classList.contains('active')) {
        updatePreview();
      }
    }, 300);
  });

  textEditor.addEventListener('scroll', function() {
    document.querySelector('.line-numbers').scrollTop = textEditor.scrollTop;
  });

  textEditor.addEventListener('keydown', function(e) {
    if (e.ctrlKey || e.metaKey) {
      if (e.key === 's') {
        e.preventDefault();
        if (e.shiftKey) {
          saveFile(true);
        } else {
          saveFile(false);
        }
      } else if (e.key === 'z') {
        e.preventDefault();
        if (e.shiftKey) {
          if (redoStack.length > 0) {
            undoStack.push(textEditor.value);
            textEditor.value = redoStack.pop();
            updateLineNumbers();
            updateStatus();
            markModified();
          }
        } else {
          if (undoStack.length > 0) {
            redoStack.push(textEditor.value);
            textEditor.value = undoStack.pop();
            updateLineNumbers();
            updateStatus();
            markModified();
          }
        }
      } else if (e.key === 'y') {
        e.preventDefault();
        if (redoStack.length > 0) {
          undoStack.push(textEditor.value);
          textEditor.value = redoStack.pop();
          updateLineNumbers();
          updateStatus();
          markModified();
        }
      } else if (e.key === 'o') {
        e.preventDefault();
        fileInput.click();
      }
    }
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = textEditor.selectionStart;
      const end = textEditor.selectionEnd;
      textEditor.value = textEditor.value.substring(0, start) + '\t' + textEditor.value.substring(end);
      textEditor.selectionStart = textEditor.selectionEnd = start + 1;
      updateLineNumbers();
      updateStatus();
    }
  });

  fileInput.addEventListener('change', function() {
    if (fileInput.files.length > 0) {
      handleFile(fileInput.files[0]);
    }
  });

  document.addEventListener('dragover', function(e) {
    e.preventDefault();
    e.stopPropagation();
    dragOverlay.classList.add('show');
  });

  document.addEventListener('dragleave', function(e) {
    e.preventDefault();
    e.stopPropagation();
    if (e.target === document.documentElement || e.target === document.body) {
      dragOverlay.classList.remove('show');
    }
  });

  document.addEventListener('drop', function(e) {
    e.preventDefault();
    e.stopPropagation();
    dragOverlay.classList.remove('show');
    if (e.dataTransfer.files.length > 0) {
      handleFile(e.dataTransfer.files[0]);
    }
  });

  document.getElementById('btnSave').addEventListener('click', function() {
    saveFile(false);
  });

  document.getElementById('btnSaveAs').addEventListener('click', function() {
    saveFile(true);
  });

  document.getElementById('btnUndo').addEventListener('click', function() {
    if (undoStack.length > 0) {
      redoStack.push(textEditor.value);
      textEditor.value = undoStack.pop();
      updateLineNumbers();
      updateStatus();
      updatePreview();
      markModified();
    }
  });

  document.getElementById('btnRedo').addEventListener('click', function() {
    if (redoStack.length > 0) {
      undoStack.push(textEditor.value);
      textEditor.value = redoStack.pop();
      updateLineNumbers();
      updateStatus();
      updatePreview();
      markModified();
    }
  });

  document.getElementById('btnFormat').addEventListener('click', formatContent);

  encodingSelect.addEventListener('change', function() {
    currentEncoding = this.value;
    document.getElementById('infoEncoding').textContent = currentEncoding;
    document.getElementById('statusEncoding').textContent = currentEncoding;
    markModified();
  });

  sheetSelect.addEventListener('change', function() {
    switchXLSXSheet(parseInt(this.value));
  });

  document.querySelectorAll('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      const panelName = this.dataset.panel;
      showTab(panelName);
    });
  });

  document.querySelectorAll('.format-item').forEach(function(item) {
    item.addEventListener('click', function() {
      const fmt = this.dataset.format;
      if (currentFormat === fmt) return;
      if (currentFormat === 'json' && fmt !== 'json') {
      }
      setCurrentFormat(fmt);
      updatePreview();
    });
  });

  tableWrapper.addEventListener('input', function(e) {
    if (e.target.classList.contains('editable')) {
      collectTableEdits();
      markModified();
    }
  });

  document.getElementById('btnTheme').addEventListener('click', function() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    if (isDark) {
      html.removeAttribute('data-theme');
      document.getElementById('themeIcon').innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
    } else {
      html.setAttribute('data-theme', 'dark');
      document.getElementById('themeIcon').innerHTML = '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
    }
  });

  updateLineNumbers();
  updateStatus();
  checkWelcome();
  updateTabVisibility();
})();
</script>
</body>
</html>
